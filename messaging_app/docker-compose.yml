version: '3.9'
services:
  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: sufian_hamza
      POSTGRES_PASSWORD: russ3509
      POSTGRES_DB: m_app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: 'django-insecure-!rvlwv9^l25yhn3x$m)xx0**&il5*7jo8#)-=(=@7daw9w0(!@'
      DATABASE_NAME: m_app_db
      DATABASE_USER: sufian_hamza
      DATABASE_PASSWORD: russ3509
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data:
