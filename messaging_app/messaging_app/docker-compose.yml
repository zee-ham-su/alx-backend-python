version: '3.9'
services:
  db:
    image: mysql:5.7
    container_name: mysql_db
    environment:
      MYSQL_USER: sufian_hamza
      MYSQL_PASSWORD: russ3509
      MYSQL_DATABASE: m_app_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: django_app
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  mysql_data:
